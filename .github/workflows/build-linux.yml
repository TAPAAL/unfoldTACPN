name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency: 
  group: build-Linux-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Packages
      run: |
        GCC_VERSION=$(sed -nE 's/^set\(DEFAULT_GCC_VERSION ([0-9]+)\)$/\1/p' CMakeLists.txt)
        [[ $GCC_VERSION =~ ^[0-9]+$ ]]
        sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -f flex bison libboost-test-dev ninja-build "gcc-${GCC_VERSION}" "g++-${GCC_VERSION}"

    - name: Build
      run: cmake --workflow release

    - name: Test
      run: cmake --workflow test
